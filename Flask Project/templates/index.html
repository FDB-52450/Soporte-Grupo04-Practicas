<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Globe.GL + Flask Example</title>
    <style>
      html, body { height: 100%; margin: 0; }
      #globeViz { width: 100%; height: 100vh; }
      .info { position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,0.9); padding: 8px 12px; border-radius: 6px; font-family: Arial, sans-serif; z-index: 10; }
    </style>
  </head>
  <body>
    <div class="info">Rotate globe. Click a country to highlight and call API.</div>
    <div id="globeViz"></div>

    <!-- Load Globe.GL UMD build from jsDelivr (CORS-friendly), then the app script -->
    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.1/dist/globe.gl.min.js"></script>
    <script src="{{ url_for('static', filename='js/globe.js') }}"></script>
  </body>
</html>
